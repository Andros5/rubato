[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubato"
version = "0.1.0"
description = "Shared-budget scheduler for AI workloads: simulate, compare and explain admission decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
opt = ["ortools>=9.10"]

[project.scripts]
rubato = "rubato.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: needs a reachable PostgreSQL (RUBATO_TEST_DSN)",
  "private: needs Andres' private radar databases",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
