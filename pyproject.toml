[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubato"
version = "1.1.0"
description = "Shared-budget scheduler for AI workloads: simulate, compare and explain admission decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.6", "ortools>=9.10", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "httpx>=0.27"]
opt = ["ortools>=9.10"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "httpx>=0.27"]

[project.scripts]
rubato = "rubato.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rubato.service.migrations" = ["*.sql"]
"rubato.data" = ["*.jsonl", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: needs a reachable PostgreSQL (RUBATO_TEST_DSN)",
  "private: needs Andres' private radar databases",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/rubato/service/*.py" = ["B008"]  # FastAPI dependency idiom
