# Local test cluster only. kind create cluster --name rubato --config deploy/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 18000, listenAddress: "127.0.0.1"}   # API (both replicas)
      - {containerPort: 30081, hostPort: 18100, listenAddress: "127.0.0.1"}   # simulated provider
