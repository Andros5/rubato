apiVersion: v1
kind: ServiceAccount
metadata: {name: rubato-api}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: rubato-api
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: rubato
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "rubato.service.app:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom: [{configMapRef: {name: rubato-config}}, {secretRef: {name: rubato-secrets}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  type: NodePort
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
