name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q

  # Service and migration tests against the real stack (PostgreSQL, API, scheduler,
  # simulated provider), the same Compose setup CONTRIBUTING.md uses locally.
  postgres:
    runs-on: ubuntu-latest
    env:
      RUBATO_TEST_CLOCK: "1"
      RUBATO_TEST_COMPOSE: "1"
      RUBATO_TEST_API: http://127.0.0.1:8000
      RUBATO_TEST_DSN: postgresql://rubato:rubato-local-only@127.0.0.1:55432/rubato
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python -m pytest -q -rs -m postgres
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
