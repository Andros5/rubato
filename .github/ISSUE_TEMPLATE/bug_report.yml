name: Bug report
description: Something behaves differently from the documentation
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command or API call, and the decision or response you got.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A synthetic trace or scenario if possible. `rubato explain` / `rubato why` output helps.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rubato --version`
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [simulator, report, service, panel, SDK / adapters, docs]
