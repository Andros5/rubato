name: Feature request
description: A new policy, metric, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or workflow is hard today?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, and how a test would show it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
